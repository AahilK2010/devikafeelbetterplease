<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devika's Daisy Catch 🌼</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial, sans-serif;
text-align:center;
background:linear-gradient(135deg,#ffd6ec,#fff7cc);
}

h1{
margin-top:15px;
}

#hud{
font-size:20px;
margin:10px;
}

#gameArea{
width:100%;
height:65vh;
position:relative;
overflow:hidden;
}

.item{
position:absolute;
font-size:50px;
cursor:pointer;
user-select:none;
}

button{
padding:12px 24px;
font-size:18px;
border:none;
border-radius:10px;
background:#ff6fb1;
color:white;
cursor:pointer;
}

#endScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<h1>🌼 Catch the Daisy 🌼</h1>
<p>Devika, catch the daisies… but avoid the bombs! 💣</p>

<div id="hud">
Score: <span id="score">0</span> |
Time: <span id="time">25</span>
</div>

<button onclick="startGame()">Start Game</button>

<div id="gameArea"></div>

<div id="endScreen">

<h2 id="resultTitle"></h2>

<p id="finalScore"></p>

<p style="max-width:420px">
Devika 🌼  

I made this tiny game just for you.  
Whether you caught every daisy or clicked a bomb,  
I hope this made you smile even a little.  

You deserve a whole field of daisies.
</p>

<button onclick="location.reload()">Play Again</button>

</div>

<script>

let score=0
let time=25
let spawnRate=900
let gameRunning=false

let spawnInterval
let timerInterval

const scoreEl=document.getElementById("score")
const timeEl=document.getElementById("time")
const gameArea=document.getElementById("gameArea")
const endScreen=document.getElementById("endScreen")
const finalScore=document.getElementById("finalScore")
const resultTitle=document.getElementById("resultTitle")

function startGame(){

if(gameRunning) return

score=0
time=25
spawnRate=900
gameRunning=true

scoreEl.textContent=score
timeEl.textContent=time

spawnInterval=setInterval(spawnItem,spawnRate)

timerInterval=setInterval(()=>{

time--
timeEl.textContent=time

// speed up spawning
if(spawnRate>300){
spawnRate-=40
clearInterval(spawnInterval)
spawnInterval=setInterval(spawnItem,spawnRate)
}

if(time<=0){
endGame(false)
}

},1000)

}

function spawnItem(){

if(!gameRunning) return

const item=document.createElement("div")
item.className="item"

// 20% chance bomb
const isBomb=Math.random()<0.2

item.textContent=isBomb?"💣":"🌼"

const x=Math.random()*(gameArea.clientWidth-50)
const y=Math.random()*(gameArea.clientHeight-50)

item.style.left=x+"px"
item.style.top=y+"px"

item.onclick=()=>{

if(isBomb){

endGame(true)

}else{

score++
scoreEl.textContent=score
item.remove()

}

}

gameArea.appendChild(item)

setTimeout(()=>{
if(item.parentNode){
item.remove()
}
},1500)

}

function endGame(bombClicked){

clearInterval(spawnInterval)
clearInterval(timerInterval)

gameRunning=false

document.querySelectorAll(".item").forEach(i=>i.remove())

if(bombClicked){
resultTitle.textContent="💣 Boom!"
}else{
resultTitle.textContent="🌼 Time's Up!"
}

finalScore.textContent="You caught "+score+" daisies!"

endScreen.style.display="flex"

}

</script>

</body>
</html>
